---
- name: Assert valid mail domains
  ansible.builtin.assert:
    that:
      - item is string
      - item == item | lower
      - item is match('^[a-z0-9]([a-z0-9-]*[a-z0-9])?([.][a-z0-9]([a-z0-9-]*[a-z0-9])?)+$')
    fail_msg: "Invalid entry in mail_domains (lower-case domain name expected): {{ item }}"
    quiet: true
  loop: "{{ maildb_domains }}"

- name: Assert valid mailboxes
  ansible.builtin.assert:
    that:
      - item.address is match('^[a-z0-9._-]+@[a-z0-9.-]+$')
      - item.address.split('@')[1] in maildb_domains
      - item.password is match('^[{]ARGON2ID[}][$]argon2id[$]')
      - (item.app_passwords | default([]) | map(attribute='id') | select('match', '^[A-Za-z0-9]{8}$') | list | length)
        == (item.app_passwords | default([]) | length)
      - (item.app_passwords | default([]) | map(attribute='password') | select('match', '^[{]ARGON2ID[}][$]argon2id[$]') | list | length)
        == (item.app_passwords | default([]) | length)
      - (item.app_passwords | default([]) | map(attribute='id') | unique | list | length)
        == (item.app_passwords | default([]) | length)
    fail_msg: >-
      Invalid mailbox {{ item.address | default('?') }}: lower-case address in one of mail_domains,
      Argon2id hashes ({ARGON2ID}$argon2id$...), unique 8-character app password ids.
    quiet: true
  loop: "{{ maildb_mailboxes }}"
  loop_control:
    label: "{{ item.address | default('?') }}"
  no_log: true

- name: Assert unique mailbox addresses
  ansible.builtin.assert:
    that:
      - (maildb_mailboxes | map(attribute='address') | unique | list | length) == (maildb_mailboxes | length)
    fail_msg: mail_mailboxes contains the same address more than once.
    quiet: true

- name: Assert valid aliases
  ansible.builtin.assert:
    that:
      - item.source is match('^[a-z0-9._+-]*@[a-z0-9.-]+$')
      - item.source.split('@')[1] in maildb_domains
      - item.destinations | length > 0
    fail_msg: "Invalid alias {{ item.source | default('?') }}: source in one of mail_domains, at least one destination."
    quiet: true
  loop: "{{ maildb_aliases }}"
  loop_control:
    label: "{{ item.source | default('?') }}"

- name: Install sqlite3 and argon2 for Python
  ansible.builtin.apt:
    name: [sqlite3, python3-argon2]
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Create the mail database group
  ansible.builtin.group:
    name: "{{ maildb_group }}"
    system: true

- name: Create the mail database directory
  ansible.builtin.file:
    path: "{{ maildb_dir }}"
    state: directory
    owner: root
    group: "{{ maildb_group }}"
    mode: "0750"

- name: Create the mail database writer
  ansible.builtin.user:
    name: "{{ maildb_writer }}"
    system: true
    group: "{{ maildb_group }}"
    home: /nonexistent
    create_home: false
    shell: /usr/sbin/nologin

- name: Read the members of the database group
  ansible.builtin.getent:
    database: group
    key: "{{ maildb_group }}"

# Earlier versions let Roundcube write the database directly.
- name: Remove former writers from the database group
  ansible.builtin.command:
    argv: [gpasswd, -d, "{{ item }}", "{{ maildb_group }}"]
  loop: "{{ maildb_former_writers }}"
  when: item in (ansible_facts['getent_group'][maildb_group][2] | split(','))
  changed_when: true

- name: Create the database directory
  ansible.builtin.file:
    path: "{{ maildb_db_dir }}"
    state: directory
    owner: "{{ maildb_writer }}"
    group: "{{ maildb_group }}"
    mode: "0750"

- name: Install the schema and export queries
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "{{ maildb_dir }}/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - schema.sql
    - export.sql
  register: maildb_sql_files

- name: Check for the mail database
  ansible.builtin.stat:
    path: "{{ maildb_path }}"
  register: maildb_file

- name: Read the schema version
  ansible.builtin.command:
    argv: [sqlite3, -batch, -noheader, "{{ maildb_path }}", "PRAGMA user_version"]
  register: maildb_schema_version
  changed_when: false
  when: maildb_file.stat.exists

# Runs before schema.sql, which sets the new version. Empty inventory hashes
# are filled in by the next synchronisation without resetting any password.
# Dovecot 2.4.1 fails the first query after a schema change on its open
# connection, hence the restart (handled by the dovecot role).
- name: Migrate the schema from version 1
  ansible.builtin.command:
    argv:
      - sqlite3
      - -bail
      - -cmd
      - .timeout 10000
      - "{{ maildb_path }}"
      - >-
        BEGIN IMMEDIATE;
        ALTER TABLE mailboxes ADD COLUMN inventory_password TEXT NOT NULL DEFAULT '';
        PRAGMA user_version = 2;
        COMMIT;
  when: maildb_file.stat.exists and maildb_schema_version.stdout | trim == '1'
  changed_when: true
  notify: Dovecot configuration changed

- name: Create or update the schema
  ansible.builtin.command:
    argv: [sqlite3, -bail, "{{ maildb_path }}", ".read {{ maildb_dir }}/schema.sql"]
  when: not maildb_file.stat.exists or maildb_sql_files.results[0].changed
  changed_when: true

- name: Set mail database permissions
  ansible.builtin.file:
    path: "{{ maildb_path }}"
    owner: "{{ maildb_writer }}"
    group: "{{ maildb_group }}"
    mode: "0640"

- name: Read the current content
  ansible.builtin.command:
    argv: [sqlite3, -batch, -noheader, "{{ maildb_path }}", ".read {{ maildb_dir }}/export.sql"]
  register: maildb_current
  changed_when: false
  no_log: true

# Used by the dovecot role to disconnect these users after the synchronisation:
# a reset password, a removed or disabled mailbox, a removed app password.
- name: Find mailboxes whose access is being revoked
  ansible.builtin.set_fact:
    maildb_revoked_new: "{{ lookup('ansible.builtin.template', 'revoked-addresses.json.j2') | from_json }}"

# Left over from a run that stopped before the dovecot role kicked them.
- name: Read revocations still pending
  ansible.builtin.slurp:
    src: "{{ maildb_revoked_file }}"
  register: maildb_revoked_pending
  failed_when: false

- name: Combine new and pending revocations
  ansible.builtin.set_fact:
    maildb_revoked_addresses: >-
      {{ ((maildb_revoked_pending.content | b64decode | from_json) if maildb_revoked_pending.content is defined else [])
         | union(maildb_revoked_new) | unique | sort }}

# Before the database changes: once it matches the inventory, the comparison
# above finds nothing any more.
- name: Remember the mailboxes whose sessions must end
  ansible.builtin.copy:
    content: "{{ maildb_revoked_addresses | to_json }}\n"
    dest: "{{ maildb_revoked_file }}"
    owner: root
    group: root
    mode: "0600"
  when: maildb_revoked_addresses | length > 0

# The synchronisation script contains password hashes: root only.
- name: Render the synchronisation script
  ansible.builtin.template:
    src: sync.sql.j2
    dest: "{{ maildb_dir }}/sync.sql"
    owner: root
    group: root
    mode: "0600"
  no_log: true

- name: Synchronise the mail database with the inventory
  ansible.builtin.command:
    argv: [sqlite3, -bail, -cmd, ".timeout 10000", "{{ maildb_path }}", ".read {{ maildb_dir }}/sync.sql"]
  when: maildb_current.stdout | trim != lookup('ansible.builtin.template', 'export.txt.j2') | trim
  changed_when: true

# --- Password service for Roundcube --------------------------------------------
- name: Create the password service's client group
  ansible.builtin.group:
    name: "{{ maildb_passwd_clients_group }}"
    system: true

- name: Create the program directory
  ansible.builtin.file:
    path: /usr/local/lib/sovereign
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Install the password service
  ansible.builtin.copy:
    src: sovereign-passwd
    dest: /usr/local/lib/sovereign/sovereign-passwd
    owner: root
    group: root
    mode: "0755"

- name: Install the password service's units
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "/etc/systemd/system/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - sovereign-passwd.socket
    - sovereign-passwd@.service
  notify: Restart the password service socket

- name: Enable the password service socket
  ansible.builtin.systemd_service:
    name: sovereign-passwd.socket
    state: started
    enabled: true
    daemon_reload: true
