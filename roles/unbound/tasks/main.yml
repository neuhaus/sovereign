---
- name: Install unbound
  ansible.builtin.apt:
    name:
      - unbound
      # Initial root trust anchor; Unbound keeps it current (RFC 5011).
      - dns-root-data
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Configure unbound
  ansible.builtin.template:
    src: sovereign.conf.j2
    dest: /etc/unbound/unbound.conf.d/sovereign.conf
    owner: root
    group: root
    mode: "0644"
    validate: unbound-checkconf %s
  notify: Unbound configuration changed

- name: Enable unbound
  ansible.builtin.systemd_service:
    name: unbound
    state: started
    enabled: true

# The resolver must be up with the new configuration before the system is
# pointed at it, or the remaining tasks (apt) lose name resolution.
- name: Apply unbound configuration
  ansible.builtin.meta: flush_handlers

- name: Wait for unbound to answer
  ansible.builtin.command:
    argv: [unbound-control, status]
  register: unbound_status
  until: unbound_status.rc == 0
  retries: 10
  delay: 2
  changed_when: false

- name: Point the system resolver at unbound
  when: unbound_manage_resolv_conf
  block:
    - name: Gather service facts
      ansible.builtin.service_facts:

    # Since systemd 262, resolved also has sockets (varlink, monitor). Left enabled,
    # they try to start the masked service on the first connection and fail, which
    # leaves the system degraded. They go first, so nothing can start it meanwhile.
    - name: Find systemd-resolved's sockets
      ansible.builtin.command:
        argv: [systemctl, list-unit-files, --no-legend, --plain, --type=socket, "systemd-resolved*"]
      register: unbound_resolved_sockets
      changed_when: false
      failed_when: false
      check_mode: false

    - name: Disable systemd-resolved's sockets
      ansible.builtin.systemd_service:
        name: "{{ item }}"
        state: stopped
        enabled: false
        masked: true
      loop: "{{ unbound_resolved_sockets.stdout_lines | map('split') | map('first') | list }}"

    # resolved would otherwise keep managing /etc/resolv.conf.
    - name: Disable systemd-resolved
      ansible.builtin.systemd_service:
        name: systemd-resolved
        state: stopped
        enabled: false
        masked: true
      when: "'systemd-resolved.service' in ansible_facts.services"

    # A server set up with an earlier version of this role may still show a failed
    # socket; masking doesn't clear that.
    - name: Clear failures of systemd-resolved's units
      ansible.builtin.shell: |
        set -e
        if systemctl is-failed --quiet {{ item | quote }}; then
          systemctl reset-failed {{ item | quote }}
          echo reset
        fi
      args:
        executable: /bin/bash
      changed_when: "'reset' in unbound_reset.stdout"
      register: unbound_reset
      loop: "{{ unbound_resolved_sockets.stdout_lines | map('split') | map('first') | list + ['systemd-resolved.service'] }}"

    - name: Check /etc/resolv.conf
      ansible.builtin.stat:
        path: /etc/resolv.conf
        follow: false
      register: unbound_resolv_conf

    - name: Remove the /etc/resolv.conf symlink
      ansible.builtin.file:
        path: /etc/resolv.conf
        state: absent
      when: unbound_resolv_conf.stat.islnk | default(false)

    - name: Write /etc/resolv.conf
      ansible.builtin.template:
        src: resolv.conf.j2
        dest: /etc/resolv.conf
        owner: root
        group: root
        mode: "0644"

    - name: Check for dhclient
      ansible.builtin.stat:
        path: /etc/dhcp/dhclient-enter-hooks.d
      register: unbound_dhclient_hooks

    - name: Keep dhclient from rewriting /etc/resolv.conf
      ansible.builtin.copy:
        src: dhclient-sovereign-nodnsupdate
        dest: /etc/dhcp/dhclient-enter-hooks.d/sovereign-nodnsupdate
        owner: root
        group: root
        mode: "0644"
      when: unbound_dhclient_hooks.stat.isdir | default(false)
