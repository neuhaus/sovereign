---
# Mail clients would show certificate errors for a missing name.
- name: Assert that the certificate covers the autoconfiguration names
  ansible.builtin.assert:
    that:
      - autoconfig_missing_names | length == 0
    fail_msg: "Add to certbot_domains: {{ autoconfig_missing_names | join(', ') }}"
    quiet: true
  vars:
    autoconfig_missing_names: >-
      {{ (autoconfig_domains | map('regex_replace', '^', 'autoconfig.') | list
          + autoconfig_domains | map('regex_replace', '^', 'autodiscover.') | list)
         | difference(certbot_domains) }}

- name: Create the autoconfig directories
  ansible.builtin.file:
    path: "{{ autoconfig_webroot }}/{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - mail
    - autodiscover
    - mobileconfig

- name: Write the client configuration files
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "{{ autoconfig_webroot }}/{{ item.dest }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - {src: config-v1.1.xml.j2, dest: mail/config-v1.1.xml}
    - {src: autodiscover.xml.j2, dest: autodiscover/autodiscover.xml}
  loop_control:
    label: "{{ item.dest }}"

- name: Create the directory for the unsigned Apple profiles
  ansible.builtin.file:
    path: "{{ autoconfig_mobileconfig_src }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Write the unsigned Apple profiles
  ansible.builtin.template:
    src: mail.mobileconfig.j2
    dest: "{{ autoconfig_mobileconfig_src }}/{{ item }}.mobileconfig"
    owner: root
    group: root
    mode: "0644"
  loop: "{{ autoconfig_domains }}"

- name: Find Apple profiles of removed domains
  ansible.builtin.find:
    paths: "{{ autoconfig_mobileconfig_src }}"
    patterns: "*.mobileconfig"
  register: autoconfig_profiles

- name: Remove Apple profiles of removed domains
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ autoconfig_profiles.files }}"
  loop_control:
    label: "{{ item.path | basename }}"
  when: (item.path | basename | regex_replace('\.mobileconfig$', '')) not in autoconfig_domains

- name: Install the profile signing script
  ansible.builtin.template:
    src: sovereign-sign-mobileconfig.j2
    dest: /usr/local/sbin/sovereign-sign-mobileconfig
    owner: root
    group: root
    mode: "0755"

# A renewed certificate gets the profiles signed again. certbot runs every
# executable in this directory after a renewal.
- name: Re-sign the Apple profiles after each renewal
  ansible.builtin.file:
    src: /usr/local/sbin/sovereign-sign-mobileconfig
    dest: /etc/letsencrypt/renewal-hooks/deploy/sovereign-mobileconfig
    state: link

- name: Sign the Apple profiles
  ansible.builtin.command:
    argv: [/usr/local/sbin/sovereign-sign-mobileconfig]
  register: autoconfig_signed
  changed_when: autoconfig_signed.stdout | length > 0

- name: Configure the autoconfig site
  ansible.builtin.template:
    src: nginx-autoconfig.conf.j2
    dest: /etc/nginx/sites-available/sovereign-autoconfig.conf
    owner: root
    group: root
    mode: "0644"
  notify: Nginx configuration changed

- name: Enable the autoconfig site
  ansible.builtin.file:
    src: /etc/nginx/sites-available/sovereign-autoconfig.conf
    dest: /etc/nginx/sites-enabled/sovereign-autoconfig.conf
    state: link
  notify: Nginx configuration changed
