---
# Names on the certificate. The first one is also the certificate name
# (/etc/letsencrypt/live/<name>/). Usually the mail host name plus the
# mta-sts., autoconfig. and autodiscover. names of each mail domain.
certbot_domains: []

# Contact address for the ACME account (expiry and policy notices).
certbot_email: ""

# ACME directory. Molecule points this at Pebble.
certbot_server: https://acme-v02.api.letsencrypt.org/directory

# Webroot served by nginx for HTTP-01 challenges.
certbot_webroot: "{{ nginx_acme_webroot | default('/var/www/acme') }}"

# Services reloaded after a renewal, if they are running.
certbot_reload_services:
  - nginx
  - postfix
  - dovecot

# The deploy hook records the certificate's expiry here for node_exporter
# (sovereign_certificate_expiry_timestamp_seconds).
certbot_metrics_dir: "{{ node_exporter_textfile_dir | default('/var/lib/prometheus/node-exporter') }}"

# Daily, and after each new certificate: do the published DANE TLSA records
# (_25._tcp.<mx>) of the mail domains' MX hosts on this certificate still
# match it? A mismatch mails root (the postmaster) once and sets
# sovereign_dane_tlsa_state{state="mismatch"}: DANE senders then defer every
# mail to this server.
certbot_dane_mail_domains: "{{ mail_domains | default([]) }}"
certbot_dane_state: /var/lib/sovereign/dane-mismatch.json

# Picked up by the systemd_timers role.
certbot_timer_jobs:
  - name: dane-check
    description: Check the published DANE TLSA records against the certificate
    command: /usr/local/sbin/sovereign-dane-check
    on_calendar: daily
    randomized_delay: 1h
