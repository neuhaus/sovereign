---
# Host name in the SMTP banner and HELO; must match the PTR record.
postfix_hostname: "{{ certbot_domains[0] }}"

# Certificate (certbot role).
postfix_tls_cert_name: "{{ certbot_domains[0] }}"
postfix_tls_cert_file: "/etc/letsencrypt/live/{{ postfix_tls_cert_name }}/fullchain.pem"
postfix_tls_key_file: "/etc/letsencrypt/live/{{ postfix_tls_cert_name }}/privkey.pem"

# TLS 1.2/1.3 with ECDHE and AEAD ciphers only (BSI TR-02102-2 / TR-03108),
# for incoming (smtpd) and outgoing (smtp) connections.
postfix_tls_protocols: ">=TLSv1.2"
postfix_tls12_ciphers: ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-AES128-GCM-SHA256
postfix_tls_curves: prime256v1 secp384r1

postfix_message_size_limit: 52428800  # 50 MiB

# Milters for all mail (rspamd role: spam filtering, DKIM/ARC signing, rate
# limits). Mail is deferred, not passed through, while a milter is down.
postfix_milters:
  - inet:127.0.0.1:11332

# TLS policy lookups for outgoing mail (mta_sts role: DANE first, then MTA-STS).
# Empty: DANE/opportunistic TLS only.
postfix_tls_policy_maps: socketmap:inet:127.0.0.1:8462:postfix

# Mail database (maildb role).
postfix_maildb_path: "{{ maildb_path | default('/var/lib/sovereign/maildb/mail.sqlite') }}"
postfix_maildb_group: "{{ maildb_group | default('maildb') }}"

# Sender Rewriting Scheme for forwarded mail (postsrsd). SRS addresses use
# this domain, which must accept mail (bounces to forwarded messages).
postfix_srs_domain: "{{ (mail_domains | default([]))[0] | default(postfix_hostname) }}"
postfix_local_domains: "{{ mail_domains | default([]) }}"
# postsrsd's socket, relative to the queue directory (cleanup runs chrooted
# there), in a directory of its own: the sandbox lets postsrsd write only
# there, not the whole spool with the mail queue in it.
postfix_srs_socket: postsrsd/srs

# Queue sizes and the age of the oldest deferred message, every 5 minutes, as
# metrics for node_exporter (sovereign_postfix_queue_*).
postfix_metrics_dir: "{{ node_exporter_textfile_dir | default('/var/lib/prometheus/node-exporter') }}"

# Picked up by the systemd_timers role.
postfix_timer_jobs:
  - name: mailqueue-metrics
    description: Measure the Postfix queue for node_exporter
    command: /usr/local/sbin/sovereign-mailqueue
    on_calendar: "*:0/5"
    persistent: false

# Logins (successful or not) per client address and minute on 465 and 587,
# enforced by Postfix itself before fail2ban has read a log line. Generous
# enough for an office behind one address.
postfix_auth_rate_limit: 30

# Hidden from Postfix (systemd InaccessiblePaths). Under /var it sees only the
# queue, its state and the mail database anyway (an allowlist); in /etc these
# are other services' secrets. It keeps /etc/letsencrypt for its TLS keys.
# Missing paths are skipped.
postfix_inaccessible_paths:
  - /etc/ssl/private
  - /etc/dovecot
  - /etc/restic
  - /etc/postsrsd.secret
  - /etc/nginx
  - /etc/radicale
  - /etc/roundcube
  - /etc/rspamd

# Mail to root (cron, unattended-upgrades, the system) goes here instead of
# /var/mail/root, which nobody reads.
postfix_root_alias: "postmaster@{{ postfix_srs_domain }}"

# Hidden from postsrsd: other services' secrets (it keeps /etc/postsrsd.conf
# and /etc/postsrsd.secret). Missing paths are skipped.
postfix_postsrsd_inaccessible_paths:
  - /etc/letsencrypt
  - /etc/ssl/private
  - /etc/dovecot
  - /etc/restic
  - /etc/nginx
  - /etc/roundcube
  - /etc/radicale
  - /etc/rspamd
