---
# postsrsd 2 (socketmap) is in Debian Testing and in trixie-backports; Debian
# 13 itself ships 1.x with a different interface. Only postsrsd is installed
# from backports (backports are pinned below stable by default).
- name: Add trixie-backports
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/debian-backports.sources
    owner: root
    group: root
    mode: "0644"
    content: |
      # Managed by Ansible (postfix role): postsrsd 2 for Debian 13.
      Types: deb
      URIs: http://deb.debian.org/debian
      Suites: trixie-backports
      Components: main
      Signed-By: /usr/share/keyrings/debian-archive-keyring.gpg
  when: sovereign_debian_track == 'trixie'
  register: postfix_backports_source

- name: Install postfix
  ansible.builtin.apt:
    name:
      - postfix
      - postfix-lmdb
      - postfix-sqlite
    state: present
    update_cache: true
    cache_valid_time: "{{ 0 if postfix_backports_source is changed else 3600 }}"

- name: Install postsrsd
  ansible.builtin.apt:
    name: postsrsd
    state: present
    default_release: "{{ 'trixie-backports' if sovereign_debian_track == 'trixie' else omit }}"

- name: Configure postsrsd
  ansible.builtin.template:
    src: postsrsd.conf.j2
    dest: /etc/postsrsd.conf
    owner: root
    group: root
    mode: "0644"
  notify: Restart postsrsd

- name: Enable postsrsd
  ansible.builtin.systemd_service:
    name: postsrsd
    state: started
    enabled: true

# proxymap runs as the postfix user and reads the mail database.
- name: Allow postfix to read the mail database
  ansible.builtin.user:
    name: postfix
    groups: "{{ postfix_maildb_group }}"
    append: true
  notify: Postfix configuration changed

- name: Create the lookup table directory
  ansible.builtin.file:
    path: /etc/postfix/sqlite
    state: directory
    owner: root
    group: postfix
    mode: "0750"

- name: Install the lookup tables
  ansible.builtin.template:
    src: sqlite-map.cf.j2
    dest: "/etc/postfix/sqlite/{{ item.name }}.cf"
    owner: root
    group: postfix
    mode: "0640"
  loop: "{{ postfix_sqlite_maps }}"
  loop_control:
    label: "{{ item.name }}"
  notify: Postfix configuration changed

- name: Configure postfix
  ansible.builtin.template:
    src: main.cf.j2
    dest: /etc/postfix/main.cf
    owner: root
    group: root
    mode: "0644"
  notify: Postfix configuration changed

# Submission (587) and submissions (465) are added to Debian's master.cf.
# They run chrooted exactly when Debian's smtp service does (Debian 13: yes,
# Testing: no).
- name: Read the chroot setting of Debian's smtp service
  ansible.builtin.command:
    argv: [postconf, -Fh, smtp/inet/chroot]
  register: postfix_smtp_chroot
  changed_when: false

# postconf -M prints the service line followed by its -o options (-h is not
# allowed with -M); only the first eight fields describe the service itself.
# Re-adding a service would drop its -o options.
- name: Read the submission services
  ansible.builtin.command:
    argv: [postconf, -M, "{{ item.name }}/inet"]
  loop: "{{ postfix_submission_services }}"
  loop_control:
    label: "{{ item.name }}"
  register: postfix_submission_current
  changed_when: false
  failed_when: false

- name: Add the submission services
  ansible.builtin.command:
    argv:
      - postconf
      - -M
      - "{{ item.item.name }}/inet={{ item.item.name }} inet n - {{ postfix_smtp_chroot.stdout }} - - smtpd"
  loop: "{{ postfix_submission_current.results }}"
  loop_control:
    label: "{{ item.item.name }}"
  when: >-
    item.stdout.split()[:8]
    != [item.item.name, 'inet', 'n', '-', postfix_smtp_chroot.stdout, '-', '-', 'smtpd']
  changed_when: true
  notify: Postfix configuration changed

- name: Read the submission service parameters
  ansible.builtin.command:
    argv: [postconf, -Ph, "{{ item.0.name }}/inet/{{ item.1.key }}"]
  loop: "{{ postfix_submission_services | subelements('params') }}"
  loop_control:
    label: "{{ item.0.name }} {{ item.1.key }}"
  register: postfix_submission_params
  changed_when: false
  failed_when: false

- name: Set the submission service parameters
  ansible.builtin.command:
    argv: [postconf, -P, "{{ item.item.0.name }}/inet/{{ item.item.1.key }}={{ item.item.1.value }}"]
  loop: "{{ postfix_submission_params.results }}"
  loop_control:
    label: "{{ item.item.0.name }} {{ item.item.1.key }}"
  # As strings: postconf prints "30", the variable may be the number 30.
  when: item.stdout != (item.item.1.value | string)
  changed_when: true
  notify: Postfix configuration changed

- name: Check for the aliases table
  ansible.builtin.stat:
    path: /etc/aliases.lmdb
  register: postfix_aliases_db

# /etc/aliases belongs to no package (Postfix's postinst creates it).
- name: Forward root's mail to the postmaster
  ansible.builtin.lineinfile:
    path: /etc/aliases
    regexp: "^root:"
    line: "root: {{ postfix_root_alias }}"
  register: postfix_aliases

- name: Build the aliases table
  ansible.builtin.command:
    argv: [newaliases]
  when: postfix_aliases is changed or not (postfix_aliases_db.stat.exists | default(false))
  changed_when: true
  notify: Postfix configuration changed

- name: Create the postfix drop-in directory
  ansible.builtin.file:
    path: /etc/systemd/system/postfix@-.service.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Sandbox postfix
  ansible.builtin.template:
    src: hardening.conf.j2
    dest: /etc/systemd/system/postfix@-.service.d/sovereign-hardening.conf
    owner: root
    group: root
    mode: "0644"
  notify: Postfix configuration changed

# daemon_reload: the sandbox drop-in must be loaded before the first start.
- name: Enable postfix
  ansible.builtin.systemd_service:
    name: postfix
    state: started
    enabled: true
    daemon_reload: true

- name: Install the queue measurement
  ansible.builtin.template:
    src: sovereign-mailqueue.j2
    dest: /usr/local/sbin/sovereign-mailqueue
    owner: root
    group: root
    mode: "0755"
