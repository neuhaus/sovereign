---
# Submission (587): STARTTLS required, SASL login required, and the sender
# address must belong to the login (smtpd_sender_login_maps).
postfix_submission_options:
  syslog_name: postfix/submission
  smtpd_tls_security_level: encrypt
  smtpd_sasl_auth_enable: "yes"
  smtpd_tls_auth_only: "yes"
  smtpd_client_restrictions: permit_sasl_authenticated,reject
  smtpd_sender_restrictions: reject_sender_login_mismatch,reject_non_fqdn_sender
  smtpd_relay_restrictions: permit_sasl_authenticated,reject
  smtpd_recipient_restrictions: reject_non_fqdn_recipient
  milter_macro_daemon_name: ORIGINATING

# Lookup tables on the mail database (sqlite_table(5): %s full key, %u local
# part, %d domain). Postfix escapes the key before substitution.
postfix_sqlite_maps:
  - name: virtual-domains
    comment: Domains this server receives mail for.
    query: SELECT name FROM domains WHERE name = '%s'
  - name: virtual-mailboxes
    comment: Existing, enabled mailboxes.
    query: SELECT 'OK' FROM mailboxes WHERE localpart = '%u' AND domain = '%d' AND enabled = 1
  - name: virtual-mailbox-identity
    comment: Every enabled mailbox maps to itself (protects it from catch-all aliases).
    query: SELECT localpart || '@' || domain FROM mailboxes WHERE localpart = '%u' AND domain = '%d' AND enabled = 1
  - name: virtual-aliases
    comment: Aliases and forwardings, including catch-all (@domain) entries.
    query: SELECT destination FROM aliases WHERE source = '%s'
  - name: sender-login
    comment: "Owners of a sender address: the mailbox itself and the mailboxes an alias points to."
    query: >-
      SELECT localpart || '@' || domain FROM mailboxes WHERE localpart = '%u' AND domain = '%d' AND enabled = 1
      UNION SELECT destination FROM aliases WHERE source = '%s'
