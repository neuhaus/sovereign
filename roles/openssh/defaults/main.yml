---
# The account you log in with, which must have an SSH key before password logins
# are turned off. By default, the user Ansible connects as.
openssh_login_user: "{{ ansible_facts['env']['SUDO_USER'] | default(ansible_facts['user_id']) }}"

# Minimum size of RSA keys, for users and host keys (BSI: about 3000 bits for
# its 120-bit security level). The role stops if the login user would be left
# without an accepted key.
openssh_required_rsa_size: 3072
