---
- name: Install nginx
  ansible.builtin.apt:
    name: nginx
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Create the ACME webroot
  ansible.builtin.file:
    path: "{{ nginx_acme_webroot }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Remove the Debian default site
  ansible.builtin.file:
    path: /etc/nginx/sites-enabled/default
    state: absent
  notify: Nginx configuration changed

- name: Create the log directory
  ansible.builtin.file:
    path: "{{ nginx_log_dir }}"
    state: directory
    owner: root
    group: adm
    # 0755 like Debian's /var/log/nginx: the workers (www-data) reopen the
    # files themselves after rotation and must reach them. The files stay
    # 0640 www-data:adm.
    mode: "0755"

- name: Rotate the logs
  ansible.builtin.template:
    src: logrotate-sovereign-nginx.j2
    dest: /etc/logrotate.d/sovereign-nginx
    owner: root
    group: root
    mode: "0644"

- name: Install the TLS settings for HTTPS sites
  ansible.builtin.template:
    src: sovereign-tls.conf.j2
    dest: /etc/nginx/snippets/sovereign-tls.conf
    owner: root
    group: root
    mode: "0644"
  notify: Nginx configuration changed

- name: Create the directory for security.txt and robots.txt
  ansible.builtin.file:
    path: "{{ nginx_wellknown_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Write security.txt
  ansible.builtin.template:
    src: security.txt.j2
    dest: "{{ nginx_wellknown_dir }}/security.txt"
    owner: root
    group: root
    mode: "0644"

- name: Write robots.txt
  ansible.builtin.copy:
    dest: "{{ nginx_wellknown_dir }}/robots.txt"
    owner: root
    group: root
    mode: "0644"
    content: |
      User-agent: *
      Disallow: /

- name: Install the security.txt and robots.txt locations
  ansible.builtin.template:
    src: sovereign-wellknown.conf.j2
    dest: /etc/nginx/snippets/sovereign-wellknown.conf
    owner: root
    group: root
    mode: "0644"
  notify: Nginx configuration changed

- name: Install the headers for static sites
  ansible.builtin.template:
    src: sovereign-static-headers.conf.j2
    dest: /etc/nginx/snippets/sovereign-static-headers.conf
    owner: root
    group: root
    mode: "0644"
  notify: Nginx configuration changed

- name: Configure the HTTP site
  ansible.builtin.template:
    src: sovereign-http.conf.j2
    dest: /etc/nginx/sites-available/sovereign-http.conf
    owner: root
    group: root
    mode: "0644"
  notify: Nginx configuration changed

- name: Enable the HTTP site
  ansible.builtin.file:
    src: /etc/nginx/sites-available/sovereign-http.conf
    dest: /etc/nginx/sites-enabled/sovereign-http.conf
    state: link
  notify: Nginx configuration changed

- name: Create the nginx drop-in directory
  ansible.builtin.file:
    path: /etc/systemd/system/nginx.service.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Sandbox nginx
  ansible.builtin.template:
    src: hardening.conf.j2
    dest: /etc/systemd/system/nginx.service.d/sovereign-hardening.conf
    owner: root
    group: root
    mode: "0644"
  notify: Nginx sandbox changed

# daemon_reload: the sandbox drop-in must be loaded before the first start.
- name: Enable nginx
  ansible.builtin.systemd_service:
    name: nginx
    state: started
    enabled: true
    daemon_reload: true

# certbot needs the challenge location before it requests a certificate.
- name: Apply nginx configuration
  ansible.builtin.meta: flush_handlers
