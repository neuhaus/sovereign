---
# Without recommends: prometheus-node-exporter-collectors adds timers for
# hardware collectors (smartmon, nvme, ...) that fail on many hosts.
- name: Install prometheus-node-exporter
  ansible.builtin.apt:
    name: prometheus-node-exporter
    state: present
    install_recommends: false
    update_cache: true
    cache_valid_time: 3600

# A file of our own; Debian's /etc/default/prometheus-node-exporter is a
# conffile and stays untouched. The drop-in below reads ours after it, so
# its ARGS win.
- name: Configure prometheus-node-exporter
  ansible.builtin.template:
    src: prometheus-node-exporter.j2
    dest: "{{ node_exporter_environment_file }}"
    owner: root
    group: root
    mode: "0644"
  notify: Node exporter configuration changed

- name: Create the prometheus-node-exporter drop-in directory
  ansible.builtin.file:
    path: /etc/systemd/system/prometheus-node-exporter.service.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Sandbox prometheus-node-exporter
  ansible.builtin.template:
    src: hardening.conf.j2
    dest: /etc/systemd/system/prometheus-node-exporter.service.d/sovereign-hardening.conf
    owner: root
    group: root
    mode: "0644"
  notify: Node exporter configuration changed

- name: Start prometheus-node-exporter with Sovereign's arguments
  ansible.builtin.template:
    src: node-exporter-override.conf.j2
    dest: /etc/systemd/system/prometheus-node-exporter.service.d/sovereign.conf
    owner: root
    group: root
    mode: "0644"
  notify: Node exporter configuration changed

# Earlier versions of this role edited it in place.
- name: Restore Debian's prometheus-node-exporter defaults
  ansible.builtin.include_role:
    name: conffile_restore
  vars:
    conffile_restore_package: prometheus-node-exporter
    conffile_restore_paths: [/etc/default/prometheus-node-exporter]
    conffile_restore_notify: [Node exporter configuration changed]

# daemon_reload: the sandbox drop-in must be loaded before the first start.
- name: Enable prometheus-node-exporter
  ansible.builtin.systemd_service:
    name: prometheus-node-exporter
    state: started
    enabled: true
    daemon_reload: true
