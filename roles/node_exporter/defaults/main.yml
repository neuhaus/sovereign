---
# Listen address of the exporter. The firewall (nftables role) only lets the
# hosts in `monitoring_sources` reach this port.
node_exporter_listen_address: ":9100"

# *.prom files here become metrics, e.g. the time of the last backup.
node_exporter_textfile_dir: /var/lib/prometheus/node-exporter

# Units whose state is exported (node_systemd_unit_state). Services and
# timers only: mounts, devices and scopes would add hundreds of series.
node_exporter_systemd_units: '.+\\.(service|timer)'
