# Managed by Ansible (Sovereign fail2ban role).
# Failed CalDAV/CardDAV logins. The client address comes from X-Forwarded-For,
# which nginx always overwrites with the real address.
[INCLUDES]
before = common.conf

[Definition]
failregex = ^%(__prefix_line)s(?:\[[^\]]*\] )*\[WARNING\] Failed login attempt from \S+ \(forwarded for '<HOST>'\):
journalmatch = _SYSTEMD_UNIT=radicale.service
