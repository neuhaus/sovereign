---
- name: Install fail2ban
  ansible.builtin.apt:
    name:
      - fail2ban
      # Required by the systemd (journald) backend.
      - python3-systemd
    state: present
    update_cache: true
    cache_valid_time: 3600

# jail.d/*.local is read after Debian's jail.d/defaults-debian.conf and
# overrides it.
- name: Configure fail2ban jails
  ansible.builtin.template:
    src: sovereign.local.j2
    dest: /etc/fail2ban/jail.d/sovereign.local
    owner: root
    group: root
    mode: "0644"
  notify: Fail2ban configuration changed

# To the journal instead of /var/log/fail2ban.log: one retention for all
# logs (logging role).
- name: Log to the journal
  ansible.builtin.copy:
    dest: /etc/fail2ban/fail2ban.d/sovereign.local
    owner: root
    group: root
    mode: "0644"
    content: |
      # Managed by Ansible (fail2ban role).
      [DEFAULT]
      logtarget = SYSTEMD-JOURNAL
  notify: Fail2ban configuration changed

- name: Extend the sshd filter for OpenSSH penalty drops
  ansible.builtin.copy:
    src: sshd.local
    dest: /etc/fail2ban/filter.d/sshd.local
    owner: root
    group: root
    mode: "0644"
  notify: Fail2ban configuration changed

# Debian's dovecot filter only knows Dovecot 2.3's wording; without this,
# the dovecot jail never sees a failed login from Dovecot 2.4.
- name: Extend the dovecot filter for Dovecot 2.4
  ansible.builtin.copy:
    src: dovecot.local
    dest: /etc/fail2ban/filter.d/dovecot.local
    owner: root
    group: root
    mode: "0644"
  notify: Fail2ban configuration changed

- name: Install the Radicale filter
  ansible.builtin.copy:
    src: radicale.conf
    dest: /etc/fail2ban/filter.d/radicale.conf
    owner: root
    group: root
    mode: "0644"
  notify: Fail2ban configuration changed

- name: Enable fail2ban
  ansible.builtin.systemd_service:
    name: fail2ban
    state: started
    enabled: true
