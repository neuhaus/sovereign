---
# Host name of the webmail; the mail host by default, which needs no extra DNS
# record or certificate name. Add any other name to certbot_domains.
roundcube_host: "{{ certbot_domains[0] }}"

# Runs PHP; owns the mail database so users can change their password there.
# Roundcube's own PHP user: not www-data, which nginx also runs as. The primary
# group gives it access to the files of Debian's Roundcube package.
roundcube_user: roundcube
roundcube_group: www-data
# Password changes go through the maildb role's password service.
roundcube_passwd_socket: "{{ maildb_passwd_socket | default('/run/sovereign-passwd.sock') }}"
roundcube_passwd_clients_group: "{{ maildb_passwd_clients_group | default('sovereign-passwd') }}"

# Debian's temp directory is reset to www-data on every package upgrade.
roundcube_temp_dir: /var/lib/roundcube-sovereign/temp

# HTTP basic auth in front of the whole webmail, so that nothing reaches
# Roundcube's PHP code without it. Required: the role fails without an entry.
#
#   roundcube_basic_auth_users:
#     - name: family                # letters, digits, ".", "_", "-", "@"
#       # openssl passwd -6
#       password: "$6$..."
#
# SHA-512 crypt only. nginx checks the hash in its event loop on every request,
# including each static file; slow hashes (bcrypt, yescrypt) would stall it. Use
# a long random password, since this hash is cheap to attack if it ever leaks.
roundcube_basic_auth_users: []

roundcube_plugins:
  - archive
  - managesieve
  - password

roundcube_password_minimum_length: 12

# Attachments grow by about a third when encoded; with 35M uploads a mail stays
# below Postfix's 50 MiB limit.
roundcube_upload_max_size: 35M
roundcube_post_max_size: 40M
roundcube_php_memory_limit: 256M

# Workers only exist while requests come in, which suits a small server.
roundcube_php_max_children: 5
# PHP-FPM socket for the Roundcube pool. /run/php is handed to root by the
# sandbox drop-in (RuntimeDirectory=php), so the master needs no
# CAP_DAC_OVERRIDE for it and its PID file there.
roundcube_fpm_socket: /run/php/roundcube.sock

# PHP-FPM sees only its own directories under /var, /srv, /opt, /mnt and /media
# (an allowlist in the sandbox drop-in), so mail, the mail database,
# calendars and backups are invisible to it. /etc can't be an allowlist:
# libraries read files there nobody lists (NSS, resolver, OpenSSL, locale).
# Its secrets are root-only anyway; these are hidden as well, against a
# compromised root process in the service. Missing paths are skipped.
roundcube_fpm_inaccessible_paths:
  - /etc/letsencrypt
  - /etc/ssl/private
  - /etc/dovecot
  - /etc/restic
  - /etc/postsrsd.secret
  - /etc/nginx
  - /etc/radicale
  - /etc/rspamd
