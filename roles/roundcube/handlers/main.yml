---
# Handlers run in the order they are defined: check first, then restart.
- name: Check PHP-FPM configuration
  ansible.builtin.command:
    argv: ["php-fpm{{ roundcube_php_version.stdout }}", --test]
  changed_when: false
  listen: PHP-FPM configuration changed

- name: Restart PHP-FPM
  ansible.builtin.systemd_service:
    name: "php{{ roundcube_php_version.stdout }}-fpm"
    state: restarted
  listen: PHP-FPM configuration changed
