---
# A daily check that files haven't been changed behind the admin's back, in
# three parts, so that upgrades cause no noise:
#   - package files: dpkg --verify (conffiles left out, some are ours)
#   - files in /usr that no package owns (planted programs or libraries)
#   - AIDE for what packages don't cover: /etc, /usr/local, /boot, SSH keys,
#     crontabs. Its database is updated at the end of each playbook run.
# New findings are mailed to root (the postmaster); metrics for node_exporter.
# This detects the obvious, not a careful root attacker, who can change the
# database and the check too.
integrity_on_calendar: "*-*-* 04:30:00"
integrity_metrics_dir: "{{ node_exporter_textfile_dir | default('/var/lib/prometheus/node-exporter') }}"
integrity_state: /var/lib/sovereign/integrity-reported

# Files in /usr no package owns but that are expected: generated by package
# scripts, or installed by Sovereign's roles. Shell patterns. Python bytecode
# (__pycache__), the MIME cache and /usr/local are always left out, as are
# symlinks into /etc/alternatives.
integrity_usr_expected:
  - /usr/lib/locale/locale-archive
  - /usr/lib/udev/hwdb.bin
  - /usr/share/info/dir
  - /usr/lib/x86_64-linux-gnu/gconv/gconv-modules.cache
  - /usr/lib/*/gdk-pixbuf-2.0/*/loaders.cache
  - /usr/share/icons/*/icon-theme.cache
  - /usr/share/glib-2.0/schemas/gschemas.compiled
  - /usr/lib/python3/dist-packages/sovereign_radicale_auth.py
  - /usr/share/roundcube/plugins/password/drivers/sovereign.php

# Picked up by the systemd_timers role.
integrity_timer_jobs:
  - name: integrity-check
    description: Check package files, unowned files in /usr and AIDE
    command: /usr/local/sbin/sovereign-integrity-check
    on_calendar: "{{ integrity_on_calendar }}"
    randomized_delay: 15m
