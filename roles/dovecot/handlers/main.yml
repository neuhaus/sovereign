---
# Handlers run in the order they are defined: check first, then restart.
# A restart (not a reload) also applies the new maildb group membership.
- name: Check dovecot configuration
  ansible.builtin.command:
    argv: [doveconf, -n]
  changed_when: false
  listen: Dovecot configuration changed

- name: Restart dovecot
  ansible.builtin.systemd_service:
    name: dovecot
    state: restarted
  listen: Dovecot configuration changed
