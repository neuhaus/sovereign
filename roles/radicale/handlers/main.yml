---
# Handlers run in the order they are defined: check first, then restart.
- name: Check radicale configuration
  ansible.builtin.command:
    argv: [runuser, -u, "{{ radicale_user }}", --, radicale, --verify-storage]
  changed_when: false
  listen: Radicale configuration changed

- name: Restart radicale
  ansible.builtin.systemd_service:
    name: radicale
    state: restarted
  listen: Radicale configuration changed
