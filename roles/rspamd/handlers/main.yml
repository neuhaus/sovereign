---
# Handlers run in the order they are defined: redis first (rspamd connects
# to its socket), then check and restart rspamd.
- name: Restart redis
  ansible.builtin.systemd_service:
    name: redis-server
    state: restarted

- name: Check rspamd configuration
  ansible.builtin.command:
    argv: [rspamadm, configtest]
  changed_when: false
  listen: Rspamd configuration changed

- name: Restart rspamd
  ansible.builtin.systemd_service:
    name: rspamd
    state: restarted
  listen: Rspamd configuration changed
