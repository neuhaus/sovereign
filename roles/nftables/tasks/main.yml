---
- name: Install nftables
  ansible.builtin.apt:
    name: nftables
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Configure the firewall ruleset
  ansible.builtin.template:
    src: nftables.conf.j2
    dest: /etc/nftables.conf
    owner: root
    group: root
    mode: "0755"
    validate: nft --check --file %s
  notify: Nftables configuration changed

- name: Enable nftables
  ansible.builtin.systemd_service:
    name: nftables
    state: started
    enabled: true
