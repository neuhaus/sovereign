---
# TCP ports open to everyone: SSH, SMTP, HTTP, IMAP, HTTPS, submission, IMAPS
# and ManageSieve.
nftables_open_tcp_ports:
  - 22
  - 25
  - 80
  - 143
  - 443
  - 587
  - 993
  - 4190

# Exporter ports, reachable only from the monitoring hosts below.
nftables_monitoring_tcp_ports:
  - 9100  # prometheus-node-exporter
  - 9900  # dovecot stats (OpenMetrics)

# IPv4 and IPv6 addresses or networks of the monitoring host(s). Set the global
# variable `monitoring_sources` in the inventory. With an empty list no rule is
# rendered and the exporter ports stay closed.
nftables_monitoring_sources: "{{ monitoring_sources | default([]) }}"
