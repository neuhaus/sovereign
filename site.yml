---
# Top-level playbook: configures every host in the `mailservers` group.
#
# Roles are added here as they are rewritten for Debian 13 / Testing (see the
# modernization plan). The legacy roles common, mailserver and webmail are not
# run any more; they are replaced step by step in Phase 2.

- name: Configure Sovereign mail servers
  hosts: mailservers
  become: true
  gather_facts: true
  roles:
    - role: preflight
    - role: unbound
    - role: nftables
    - role: fail2ban
    - role: nginx
    - role: certbot
    - role: maildb
    - role: mta_sts
    - role: autoconfig
    - role: rspamd
    - role: postfix
    - role: dovecot
    - role: unattended_upgrades
    - role: systemd_timers
    - role: node_exporter
