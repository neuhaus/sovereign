---
# Top-level playbook: configures every host in the `mailservers` group.
#
# Settings: inventory/group_vars/mailservers.yml. Run with:
#   ansible-playbook -i inventory site.yml

- name: Configure Sovereign mail servers
  hosts: mailservers
  become: true
  gather_facts: true
  roles:
    - role: preflight
    - role: openssh
    - role: timesyncd
    - role: unbound
    - role: nftables
    - role: fail2ban
    - role: nginx
    - role: certbot
    - role: maildb
    - role: mta_sts
    - role: autoconfig
    - role: rspamd
    - role: postfix
    - role: dovecot
    - role: radicale
    - role: roundcube
    - role: restic
    - role: unattended_upgrades
    - role: systemd_timers
    - role: node_exporter
