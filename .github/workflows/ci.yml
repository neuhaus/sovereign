---
name: CI

on:
  push:
    branches:
      - master
      - trixie-wip
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: test-requirements.txt

      - name: Install tooling
        run: |
          pip install -r test-requirements.txt
          ansible-galaxy collection install -r requirements.yml

      - name: yamllint
        run: yamllint --strict .

      - name: ansible-lint
        run: ansible-lint

      # Loads every scenario including Molecule's environment interpolation
      # (a stray "$" in molecule.yml/config.yml breaks it), without incus.
      - name: Molecule configuration
        run: molecule list

  molecule:
    needs: lint
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        scenario:
          - trixie
          - testing
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: test-requirements.txt

      - name: Install tooling
        run: |
          pip install -r test-requirements.txt
          ansible-galaxy collection install -r requirements.yml

      - name: Install and initialise incus
        run: |
          sudo apt-get update
          sudo apt-get install -y incus
          sudo incus admin init --auto
          sudo usermod -aG incus-admin "$USER"
          # Docker on the runner sets the FORWARD policy to DROP, which cuts
          # the incus containers off from the network.
          sudo iptables -P FORWARD ACCEPT

      - name: Run Molecule
        env:
          SCENARIO: ${{ matrix.scenario }}
          PY_COLORS: "1"
          ANSIBLE_FORCE_COLOR: "1"
        # sg picks up the incus-admin group membership added above. The
        # instances are kept on failure so the next step can inspect them.
        run: sg incus-admin -c "molecule test --scenario-name $SCENARIO --destroy never"

      - name: Show diagnostics from the test instances
        if: failure()
        run: |
          for instance in $(sudo incus list --format csv --columns n); do
            echo "::group::${instance}: failed units and their journals"
            sudo incus exec "$instance" -- systemctl --failed --no-pager || true
            for unit in $(sudo incus exec "$instance" -- systemctl --failed --plain --no-legend | awk '{print $1}'); do
              sudo incus exec "$instance" -- systemctl status --no-pager --full "$unit" || true
              sudo incus exec "$instance" -- journalctl --no-pager --boot --unit "$unit" --lines 100 || true
            done
            echo "::endgroup::"
          done

      - name: Destroy the test instances
        if: always()
        env:
          SCENARIO: ${{ matrix.scenario }}
        run: sg incus-admin -c "molecule destroy --scenario-name $SCENARIO"
