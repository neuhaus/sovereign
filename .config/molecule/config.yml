---
# Shared Molecule base configuration, merged into every scenario in molecule/.
# Scenarios only set what differs between them (target track, names, subnet).
#
# Test topology (one incus bridge per scenario, static IPv4 addresses):
#   mail    system under test (group "mailservers")
#   dns     authoritative mock DNS (knot) for the test domain
#   pebble  local ACME server (Pebble)

dependency:
  name: galaxy
  # Collections are installed from requirements.yml before Molecule runs.
  enabled: false

driver:
  name: default
  options:
    managed: true

platforms:
  - name: mail
    groups:
      - mailservers
  - name: dns
    groups:
      - testinfra
  - name: pebble
    groups:
      - testinfra

provisioner:
  name: ansible
  env:
    ANSIBLE_ROLES_PATH: ${MOLECULE_PROJECT_DIRECTORY}/roles
  playbooks:
    create: ../resources/create.yml
    prepare: ../resources/prepare.yml
    converge: ../resources/converge.yml
    destroy: ../resources/destroy.yml
  inventory:
    group_vars:
      all:
        sovtest_domain: sovereign.test
        sovtest_image: images:debian/13
        # Foreign domain served by the mock DNS; its MX is an SMTP sink on dns.
        sovtest_external_domain: ext.test
        # DNSSEC-signed mock zones (see prepare.yml): signed.test validates,
        # broken.test gets a wrong trust anchor and must fail validation.
        sovtest_signed_zones:
          - signed.test
          - broken.test
      mailservers:
        # Test accounts. Passwords (test only): alice "sovtest-alice-pass",
        # alice's app password "AlicPhn1-sovtest-app-phone", bob "sovtest-bob-pass".
        # Molecule expands environment variables in this file, so the dollar signs
        # of the hashes are doubled.
        mail_domains:
          - "{{ sovtest_domain }}"
        mail_mailboxes:
          - address: "alice@{{ sovtest_domain }}"
            password: "{ARGON2ID}$$argon2id$$v=19$$m=65536,t=3,p=1$$hzBIYixDZWHOAU73APqNgg$$wgY6noKJaN1gGyyiThFkC5vOR6BzcQg1XYdl8u9YrmE"
            app_passwords:
              - name: phone
                id: AlicPhn1
                password: "{ARGON2ID}$$argon2id$$v=19$$m=65536,t=3,p=1$$sjSnTepvTiaLdWZ96rsYPg$$RNGsSHThLFD9eEA4WzbnBnou69e+R0MuVfr43TFkbAk"
          - address: "bob@{{ sovtest_domain }}"
            password: "{ARGON2ID}$$argon2id$$v=19$$m=65536,t=3,p=1$$uuSbK3yYxUdFBwxKdgH2SQ$$btDjUirMAqWOiBTzd+2FkQS15ap9gTR/X7LwgDYTuzA"
        mail_aliases:
          - source: "postmaster@{{ sovtest_domain }}"
            destinations: ["alice@{{ sovtest_domain }}"]
          - source: "team@{{ sovtest_domain }}"
            destinations: ["alice@{{ sovtest_domain }}", "bob@{{ sovtest_domain }}"]
          # Forwarding to a foreign domain (SRS test).
          - source: "fwd@{{ sovtest_domain }}"
            destinations: ["someone@{{ sovtest_external_domain }}"]
        unbound_nodefault_zones:
          - test.
        unbound_stub_zones:
          - name: "{{ sovtest_domain }}"
            addresses: ["{{ sovtest_ips.dns }}"]
            insecure: true
          - name: "{{ sovtest_external_domain }}"
            addresses: ["{{ sovtest_ips.dns }}"]
            insecure: true
          - name: signed.test
            addresses: ["{{ sovtest_ips.dns }}"]
          - name: broken.test
            addresses: ["{{ sovtest_ips.dns }}"]
        unbound_trust_anchor_files:
          - /etc/unbound/sovtest-anchors.conf
        # Certificates come from Pebble, which validates HTTP-01 via the mock DNS.
        certbot_server: "https://{{ sovtest_ips.pebble }}:14000/dir"
        certbot_email: "postmaster@{{ sovtest_domain }}"
        certbot_domains:
          - "mail.{{ sovtest_domain }}"
          - "mta-sts.{{ sovtest_domain }}"
          - "autoconfig.{{ sovtest_domain }}"
          - "autodiscover.{{ sovtest_domain }}"
        # dns acts as the monitoring host; pebble must not reach the exporters.
        monitoring_sources:
          - "{{ sovtest_ips.dns }}"
        systemd_timers_jobs:
          - name: molecule-check
            description: Molecule test job
            command: /usr/bin/touch /run/sovereign-molecule-check
            on_calendar: hourly

verifier:
  name: testinfra
  directory: ../resources/tests
